<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ff">
  <meta name="description" content="A private, local Digital Wellbeing dashboard for Windows.">
  <title>Digital Wellbeing</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('dw_theme') || 'auto';
        var isDark = saved === 'dark' || (saved === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Sidebar">
      <div class="brand">
        <div class="brand-badge">DW</div>
        <span>Digital<br><strong>Wellbeing</strong></span>
      </div>
      <div class="side-group-label">YOUR SPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button type="button" class="nav-item active" data-page="overview"><span class="nav-icon" data-icon="overview"></span><span>Overview</span></button>
        <button type="button" class="nav-item" data-page="apps"><span class="nav-icon" data-icon="apps"></span><span>App activity</span></button>
        <button type="button" class="nav-item" data-page="focus"><span class="nav-icon" data-icon="focus"></span><span>Focus mode</span></button>
        <button type="button" class="nav-item" data-page="bedtime"><span class="nav-icon" data-icon="moon"></span><span>Bedtime mode</span></button>
        <button type="button" class="nav-item" data-page="insights"><span class="nav-icon" data-icon="insights"></span><span>Insights</span></button>
      </nav>
      <div class="side-group-label side-settings-label">PREFERENCES</div>
      <nav class="side-nav" aria-label="Preferences">
        <button type="button" class="nav-item" data-page="settings"><span class="nav-icon" data-icon="settings"></span><span>Settings</span></button>
      </nav>
      <div class="side-bottom">
        <div class="side-mood" id="side-mood"><span class="mood-dot"></span><span>Starting tracker…</span></div>
        <p>Your activity stays on this PC.</p>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-title"><span class="eyebrow" id="page-eyebrow">Wednesday, 7 October</span><h1 id="page-title">Overview</h1></div>
        <div class="topbar-actions">
          <label class="date-control"><span class="date-icon" data-icon="calendar"></span><span class="date-text" id="date-label-text">Today</span><input id="report-date" type="date" aria-label="Report date"></label>
          <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" data-action="toggle-theme-quick" title="Toggle dark / light mode" aria-label="Toggle theme"><span class="theme-btn-icon" data-icon="moon"></span></button>
          <span class="live-pill" id="live-pill"><span class="live-dot"></span>Live tracking</span>
        </div>
      </header>
      <main id="content" class="content" tabindex="-1">
        <div class="loading-card"><div class="loading-spark"></div><h2>Getting your dashboard ready</h2><p>Connecting to the local tracker…</p></div>
      </main>
      <footer class="footer">Digital Wellbeing for Windows <span>•</span> Private by design</footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
